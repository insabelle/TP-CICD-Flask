
name: TP CI-CD Flask

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier la syntaxe
        run: python -m compileall -q app.py test_app.py

  test:
    name: Test Application
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest -v

    deploy:
    name: Deploy Application
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Vérifier la réussite des tests
        run: echo "Build et Tests réussis. Déploiement à configurer."